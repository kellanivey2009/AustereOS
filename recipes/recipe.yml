---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

# BASE
name: austereos
description: A bare-chilling-bones OS
base-image: ghcr.io/blue-build/base-images/fedora-base
image-version: latest

# LOCATION
modules:
- type: files
  files:
  - source: system
    destination: /

- type: dnf
  group-install:
    packages:
    - gnome-desktop
    - plasma-desktop

- type: script
  snippets:
    # 1. Stop SDDM from competing or starting entirely
    - systemctl mask sddm.service
    # 2. Force GDM to be the master login manager & Forces Fedora to boot into the graphical desktop interface automatically
    - systemctl enable gdm.service
    # 3. Ensure the system defaults to the graphical login interface
    - systemctl set-default graphical.target

- type: signing
