---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: austereos                                            # Name
description: This is my personal OS image.                 # Description
base-image: ghcr.io/ublue-os/silverblue-main               # Base
image-version: 44                                          # Version
modules:                                                   # Modules
  - type: files                                            # Files
    files:
      - source: system
        destination: /
  - type: dnf                                              # DNF Packages (Baked In)
    repos:
    install:
      packages:
      - distrobox
      - podman
      - docker-compose
      - podman-compose
    remove:
      packages:
        - firefox
        - firefox-langpacks
  - type: default-flatpaks                                 # Flatpaks (Removeable)
    configurations:
      - notify: true
        scope: system
        install:
        - net.mullvad.MullvadBrowser
        - org.chromium.Chromium
        - io.github.kolunmi.Bazaar
      - scope: user
  - type: signing
 
  
  # yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
  # image will be published to ghcr.io/<user>/<name>
  # copies files/system/* (* means everything inside it) into your image's root folder / (destination)
  # module configuration, executed in order
  # you can include multiple instances of the same module
