---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: austereos                   # Name
description: A bare-chilling-bones OS  # Description
base-image: ghcr.io/ublue-os/base-nvidia  # Base
image-version: latest             # Version
modules:                          # Modules
  - type: files                  # Files
    files:
      - source: system
        destination: /
  - type: dnf                     # DNF Packages (Baked In)
    install:
      packages:
        - gnome-desktop
        - distrobox
        - gmd
  - type: default-flatpaks        # Flatpaks (Removable)
    configurations:
      - notify: true
        scope: system
        install:
          - io.github.kolunmi.Bazaar
      - scope: user
  - type: script
    scripts:
      - gnome-setup.sh
  - type: signing
