---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

# BASE
name: austereos
description: A bare-chilling-bones OS
base_image: ghcr.io/blue-build/base-images/fedora-base
image-version: latest

# LOCATION
modules:
- type: files
  files:
  - source: system
    destination: /

- type: dnf
  group-install:
    packages:
    - gnome-desktop

- type: script
  snippets:
    # Forces Fedora to boot into the graphical desktop interface automatically
    - systemctl enable gdm.service

- type: signing
