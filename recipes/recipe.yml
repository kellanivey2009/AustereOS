---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

# BASE
name: austereos
description: A bare-chilling-bones OS
base-image: ghcr.io/blue-build/base-images/fedora-base
image-version: latest

# LOCATION
modules:

- type: dnf
  group-install:
    with-optional: false
    packages:
    - gnome-shell
    - gnome-session
    - gdm
    - plasma-workspace
    
- type: files
  files:
  - source: system
    destination: /

- type: script
  snippets:
    - systemctl mask sddm
    - systemctl enable gdm.service
    - systemctl set-default graphical.target

- type: signing
